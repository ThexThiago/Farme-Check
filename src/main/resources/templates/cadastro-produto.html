<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Farm Check</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>

<div class="container">

    <h2>Cadastro de Medicamentos</h2>

    <form action="/efetuar-cadastro-produto" method="post">

        <div class="form-group">
            <label>Nome do medicamento:</label>

            <input type="text"
                   class="form-control"
                   placeholder="Digite o nome do medicamento"
                   name="nome">
        </div>

        <div class="form-group">
            <label>Preço:</label>

            <input type="number"
                   class="form-control"
                   placeholder="Digite o preço"
                   name="preco">
        </div>

        <div class="form-group">
            <label>Descrição:</label>

            <input type="text"
                   class="form-control"
                   placeholder="Digite a descrição"
                   name="descricao">
        </div>

        <div class="form-group">
            <label>Fornecedor:</label>

            <input type="text"
                   class="form-control"
                   placeholder="Digite o fornecedor"
                   name="fornecedor">
        </div>

        <!-- 🔥 NOVA FUNCIONALIDADE -->
        <div class="form-group">
            <label>Unidade da Farmácia:</label>

            <input type="text"
                   class="form-control"
                   placeholder="Ex: UBS Centro"
                   name="unidadeFarmacia">
        </div>

        <!-- 🔥 DISPONIBILIDADE -->
        <div class="form-group">
            <label>Disponível:</label>
            <br>

            <input type="checkbox" name="disponivel">
        </div>

        <button type="submit" class="btn btn-primary">
            Cadastrar
        </button>

    </form>

</div>

</body>
</html>
